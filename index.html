<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Which English Character Are You?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section id="start-screen" class="screen active">
    <div class="card hero">
      <p class="eyebrow">ENGLISH CHARACTER PHOTO BOOTH</p>
      <h1>Which English Character Are You?</h1>
      <p>Answer 8 questions, discover your character, and take four photos together.</p>
      <button id="start-btn" class="primary">START</button>
    </div>
  </section>

  <section id="quiz-screen" class="screen">
    <div class="card">
      <div class="progress-row"><span id="question-number"></span><span id="progress-count"></span></div>
      <div class="progress"><div id="progress-fill"></div></div>
      <h2 id="question-text"></h2>
      <p id="question-korean" class="muted"></p>
      <div id="answers" class="answers"></div>
    </div>
  </section>

  <section id="result-screen" class="screen">
    <div class="card result">
      <p class="eyebrow">YOUR ENGLISH CHARACTER IS</p>
      <img id="result-image" class="result-image" alt="">
      <h2 id="result-name"></h2>
      <p id="result-description" class="muted"></p>
      <div id="result-keywords" class="keywords"></div>
      <button id="photo-btn" class="primary">TAKE PHOTOS</button>
      <button id="retry-btn" class="secondary">TRY AGAIN</button>
    </div>
  </section>

  <section id="photo-screen" class="screen">
    <div class="card photo-card">
      <div class="photo-head"><h2 id="photo-title"></h2><strong id="shot-counter">1 / 4</strong></div>
      <div class="camera-stage">
        <video id="video" autoplay playsinline muted></video>
        <img id="character-overlay" alt="Character pose">
        <div id="camera-message">Tap “Start Camera” and allow camera access.</div>
      </div>
      <div class="actions">
        <button id="camera-btn" class="secondary">START CAMERA</button>
        <button id="capture-btn" class="primary" disabled>TAKE PHOTO</button>
      </div>
      <div id="preview-grid" class="preview-grid"></div>
      <canvas id="capture-canvas" hidden></canvas>
      <div class="actions">
        <button id="save-strip-btn" class="primary hidden">SAVE 4-CUT PHOTO</button>
        <button id="back-result-btn" class="secondary">BACK</button>
      </div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
