<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7efff">
  <title>Which English Character Are You?</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <!-- START -->
    <section id="start-screen" class="screen active">
      <div class="final-start-cover">
        <img
          src="images1/start-cover.png"
          class="final-cover-image"
          alt="Which English Character Are You?"
        >

        <button
          id="start-btn"
          class="final-start-button"
          type="button"
          aria-label="Start the quiz"
        >
          START
        </button>
      </div>
    </section>

    <!-- QUIZ -->
    <section id="quiz-screen" class="screen">
      <div class="card quiz-card">

        <div class="progress-row">
          <span id="question-number">Question 1</span>
          <span id="progress-count">1 / 8</span>
        </div>

        <div class="progress">
          <div id="progress-fill"></div>
        </div>

        <h2 id="question-text"></h2>
        <p id="question-korean" class="muted"></p>

        <div id="answers" class="answers"></div>
      </div>
    </section>

    <!-- RESULT -->
    <section id="result-screen" class="screen">
      <div class="card result">

        <p class="eyebrow">
          YOUR ENGLISH CHARACTER
        </p>

        <img
          id="result-image"
          class="result-image"
          alt="Character result"
        >

        <h2 id="result-name"></h2>

        <p
          id="result-description"
          class="muted"
        ></p>

        <div
          id="result-keywords"
          class="keywords"
        ></div>

        <div class="actions">
          <button
            id="photo-btn"
            class="primary"
            type="button"
          >
            OPEN PHOTO BOOTH
          </button>

          <button
            id="retry-btn"
            class="secondary"
            type="button"
          >
            TRY AGAIN
          </button>
        </div>
      </div>
    </section>

    <!-- PHOTO BOOTH -->
    <section id="photo-screen" class="screen">
      <div class="card photo-card">

        <div class="photo-head">
          <h2 id="photo-title">
            Take Photos
          </h2>

          <strong id="shot-counter">
            1 / 4
          </strong>
        </div>

        <div class="camera-stage">

          <video
            id="video"
            autoplay
            playsinline
            muted
          ></video>

          <img
            id="character-overlay"
            alt="Character pose"
          >

          <div
            id="countdown"
            class="countdown hidden"
          >
            3
          </div>

          <div id="camera-message">
            Press START CAMERA and allow camera access.
          </div>

        </div>

        <canvas
          id="capture-canvas"
          class="hidden"
        ></canvas>

        <div class="actions">

          <button
            id="camera-btn"
            class="secondary"
            type="button"
          >
            START CAMERA
          </button>

          <button
            id="capture-btn"
            class="primary"
            type="button"
            disabled
          >
            TAKE PHOTO
          </button>

        </div>

        <div
          id="preview-grid"
          class="preview-grid"
        ></div>

        <div class="actions">

          <button
            id="save-strip-btn"
            class="primary hidden"
            type="button"
          >
            SAVE 4-CUT PHOTO
          </button>

          <button
            id="back-result-btn"
            class="secondary"
            type="button"
          >
            BACK
          </button>

        </div>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
