<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta name="theme-color" content="#f4ecff">

  <title>Which English Character Are You?</title>

  <link
    rel="stylesheet"
    href="style.css?v=20260731-final2"
  >
</head>

<body>
  <main class="app-container">

    <!-- 시작 화면 -->
    <section id="start-screen" class="screen active">
      <div class="start-cover-wrap">

        <img
          class="final-cover-image"
          src="images1/start-cover-final-20260731.png?v=20260731-final2"
          alt="Which English Character Are You?"
        >

        <button
          id="start-btn"
          class="cover-start-button"
          type="button"
          aria-label="Start Quiz"
        >
          START
        </button>

      </div>
    </section>


    <!-- 퀴즈 화면 -->
    <section id="quiz-screen" class="screen">
      <div class="quiz-card">

        <div class="quiz-top">
          <span id="question-number" class="question-number">
            Question 1
          </span>

          <span id="progress-count" class="progress-count">
            1 / 8
          </span>
        </div>

        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <h1 id="question-text" class="question-text"></h1>

        <p id="question-korean" class="question-korean"></p>

        <div id="answers" class="answers"></div>

      </div>
    </section>


    <!-- 분석 중 화면 -->
    <section id="analysis-screen" class="screen">
      <div class="analysis-card">

        <div class="analysis-spinner"></div>

        <h2>Analyzing Your English Character</h2>

        <p class="analysis-korean">
          나의 영어 캐릭터를 분석하고 있어요.
        </p>

        <div class="analysis-steps">
          <div class="analysis-step">
            ✓ Checking your interests
          </div>

          <div class="analysis-step">
            ✓ Finding your strengths
          </div>

          <div class="analysis-step">
            ✓ Matching your character
          </div>
        </div>

      </div>
    </section>


    <!-- 결과 화면 -->
    <section id="result-screen" class="screen">
      <div class="result-card">

        <p class="result-label">
          Your English Character Is
        </p>

        <h1 id="result-name" class="result-name"></h1>

        <div class="result-image-wrap">
          <img
            id="result-image"
            class="result-image"
            src=""
            alt="English Character"
          >
        </div>

        <div class="result-type-box">
          <span id="result-type" class="result-type"></span>
          <span id="result-years" class="result-years"></span>
        </div>

        <p
          id="result-description"
          class="result-description"
        ></p>

        <blockquote
          id="result-quote"
          class="result-quote"
        ></blockquote>

        <div
          id="result-keywords"
          class="result-keywords"
        ></div>

        <div class="result-buttons">

          <button
            id="photo-btn"
            class="primary-button"
            type="button"
          >
            📸 Take Photos Together
          </button>

          <button
            id="retry-btn"
            class="secondary-button"
            type="button"
          >
            Try Again
          </button>

        </div>

      </div>
    </section>


    <!-- 포토부스 화면 -->
    <section id="photo-screen" class="screen">
      <div class="photo-card">

        <div class="photo-header">

          <button
            id="back-result-btn"
            class="back-button"
            type="button"
            aria-label="결과 화면으로 돌아가기"
          >
            ← 결과로
          </button>

          <div>
            <h1 id="photo-title" class="photo-title">
              Take Photos
            </h1>

            <p id="shot-counter" class="shot-counter">
              1 / 4
            </p>
          </div>

        </div>


        <div class="camera-stage">

          <video
            id="video"
            autoplay
            muted
            playsinline
          ></video>

          <img
            id="character-overlay"
            class="character-overlay"
            src=""
            alt="Character Pose"
          >

          <div
            id="countdown"
            class="countdown hidden"
          >
            3
          </div>

          <div
            id="camera-message"
            class="camera-message"
          >
            카메라 시작 버튼을 눌러 주세요.
          </div>

        </div>


        <div class="camera-buttons">

          <button
            id="camera-btn"
            class="secondary-button"
            type="button"
          >
            Start Camera
          </button>

          <button
            id="capture-btn"
            class="primary-button"
            type="button"
            disabled
          >
            TAKE PHOTO
          </button>

        </div>


        <div
          id="preview-grid"
          class="preview-grid"
        ></div>


        <button
          id="save-strip-btn"
          class="primary-button save-strip-button hidden"
          type="button"
        >
          Save 4-Cut Photo
        </button>


        <div class="photo-bottom-actions">

          <button
            id="retake-btn"
            class="secondary-button"
            type="button"
          >
            다시 찍기
          </button>

          <button
            id="back-result-bottom-btn"
            class="secondary-button"
            type="button"
          >
            결과로 돌아가기
          </button>

        </div>


        <canvas
          id="capture-canvas"
          class="hidden"
        ></canvas>

      </div>
    </section>

  </main>

  <script src="script.js?v=20260731-final2"></script>
</body>
</html>
